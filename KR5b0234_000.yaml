body:
  text: 平旦六梵應天關萬帝朝雲宫飛香靄朱日流詠順清風神真散瑶華靈音泛太空衆聖赴期來逺近聽鳴鐘日出紫微發天光青華生琅音萬景照雲宫衆仙禮玉岑流響動長空餘聲振寶林慶此天真樂散我幽滯心辰時披雲登天軒環目矚九清遐想排雲逸俯聞空洞聲衆動非所觀妙音良可聽發彼瓊瑶響解兹幽蔚情禺中玉女秉靈機金鐘振遐響開覺萬天人拔度九幽爽苦魂披雲出沉𩲸乘運上神力叵思議法音被無象正中太虛包六氣至道敷一元梵聲綸地絡法鼓出天端境空心自靜情攀志更喧察此六時響釋我百憂煩日映圓童轉空輪神女撫幽機晝夜天關盡循環星希鳯鳴十二時龍翔百六歸擊以瓊華音暢我天尊成晡時四龍隨天運五帝推日車月女散寶香雲宫下瑶華十仙聆法鐘俱集太上家五苦長解脫恆吟空洞歌曰入髙抗萬天機晝夜相循環太上敷聖教普告於世間應境立真王分職有司官仙童擊玉鐘衆聖朝天關黃昏朱景控朝暉紫輪乘夜月二曜遞推遷四序無停歇玉童唱時至寶鐘鏗然發稽首無上尊攜駕登金闕人定陽輪下幽室隂景照雲房珠臺鏗瑶音碧殿藹瓊香妙聲發空洞微響含幽章共美虛中曲清音風外揚中夜靈童啓星扉聖母御雲龍日月相代謝晝夜更故新天下萬合香空降千品真玉音羅太虛金爐生紫烟雞鳴五億諸天境三千世界中方万列仙域處處有神鐘梵音生法宇妙韻起靈風因緣常不絶功德永無窮常鳴鐘磬偈盥潔披天衣端念陟雲臺時至當鳴鐘仙聖步虛來瓊音徹玄都金香藹紫微萬騎雲間逸九華空外飛鳯凰翩翻翔獅子縱橫馳王女羅瑶饌仙人坐誦經稽首禮十方虛想在三清天尊住虛空惚恍本無形湛然自靈應常能感精誠西妃撫瑶磬齊和空洞聲地獄無罪魂天堂奏善名一振琅鐘響萬衆稽首聽太上曰此頌偈龍漢劫初元始傳諸天帝王誦之者魂神清暢衆真降房鳴鐘祝之與響齊聞朗徹十方萬聖歡樂九幽赦魂男女歌詠國土安寧永享福祚世世無窮太上曰衆集時聽三下鐘冠帶整香長鐘竟嚴淨威儀復與梵音齊發庠雅詣座旋繞竟巳叩磬節之人天聖凡皆以之集當審愼焉勿罹五帝之罰也太上曰玄都有八瓊華鐘置中天之臺應六梵氣周十二機不擊自鳴聲徹十方衆真稽首聽聲而㑹玄都諸天取則矣智德真人及同來五百衆一時稱善稽首而退洞玄靈寶鐘磬威儀經
