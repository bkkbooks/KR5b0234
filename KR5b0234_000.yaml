front:
  text: 洞玄靈寶鐘磬威儀經爾時智德真人與五百真人等衆同詣太上稽首請問集衆威儀太上曰衆有二種一者聖衆二者凡衆若說法齊戒禮拜下謝救度生死一切福㑹應當來集皆聽擊鐘昔元始天尊於色界天中教化說法時至不齊衆有前後放十種相光從眉間出徹照諸天五億世界無量國土普使聞知示大神力演真一妙道合五和之精成無量寶鐘各隨方域同發靈音聲遍天地響若琳琅皆作洞章晝夜震動應十二時一切衆生聞悉歡喜百惱皆除時不信者信未悟者悟生諸善慧興正念心自是之後鐘聲制度普遍十方汝今所請當欲開悟諸衆生智德稽首弟子後生末學雖聞鐘磬未解威儀不審諸天所有同於下界亦有等差太上告曰三清上境三界十方大小名目亦有不同今粗說之汝其聽焉太上告曰大羅天中有九明華鐘七矅神鐘洞光浮鐘飛精空鐘大光雲鐘開天光鐘自然神鐘玉清天中有鳯生天鐘華寶雲鐘霄焰靈鐘玉龍華鐘空明寶鐘九合光鐘萬變瑶鐘上清天中有十華寶鐘四華鳯鐘電耀明鐘龍耀明鐘鸞翔華鐘太清天中有九精合成鐘百寶空明鐘結雲華鳯鐘天飛龍鐘九天中有自鳴華鐘九色光鐘萬寶華鐘大自然鐘皆結自然真精妙氣而成光明洞徹神化無方千形萬象應變難名或大或小隨運自鳴音聲響亮和雅應神四梵天中有度命神鐘長生靈鐘濟生神鐘消魔神鐘反魂神鐘制魔神鐘降魔神鐘伏邪神鐘揮靈寶鐘集仙瓊鐘歸真和鐘三界天中有保生之鐘昌樂之鐘自鳴之鐘安國之鐘應命之鐘寶齡之鐘延和之鐘長壽之鐘護神之鐘皆以紫鳳翠龍之金照夜明霄之寶承九天之氣九泉之火合而成之宛利天中有蓮花之鐘翔雲之鐘宛鳯之鐘交龍之鐘遐齡之鐘消災之鐘度厄之鐘護國之鐘定生之鐘保命之鐘修期之鐘辟兵之鐘消魔之鐘皆以金銀銅鐵瓊瑶寶玉鎔鑄雕刻而成各有百千萬億或六時九時十二時悉有典鐘靈官玉童玉女金精猛獸獅子辟邪金剛神王防守侍衛晝夜考擊開悟羣生於是授智德威儀科誡告下三界十方令得見聞於是智德禮拜太上伏受威儀太上曰世聞鐘用金銀銅鐵作兩角三角四角六角九角無角大小隨宜懸治左方臺閣樓殿依時整法服祝誦讃唱擊之皆初急之緩踈打三下若八下為節急之復初急之緩踈擊二十四槌急之復急之緩徐擊十二槌畢太上曰非時不得妄擊若不整法服清淨祝誦失其節度皆五帝考之死墮寒冰之中百劫當生無眼之報愼之焉太上曰若道士終亡擊鐘三百六十槌示人知終太上曰磬以金銀銅鐵玉作若行道禮誦讃唱齊誡擊以節之皆當作架懸之智德因說祝頌十三章
